      summary: Create a contact export
      description: >-
        Export contacts asynchronously. `spreadsheet_csv` writes the standard columns plus the selected custom
        fields under their labels and escapes formula-triggering cells with a leading apostrophe. `package` writes a
        zip with `contacts.jsonl` and `manifest.json` that keeps option keys, types, empty versus missing values and
        exact decimals, and can be restored with `POST /contacts/restores`. The API key needs the export grant on
        every selected field. The file can be downloaded for 7 days while the key keeps that access.
      operationId: createContactExport
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for this request, scoped to the workspace and kept for 24 hours.
          schema:
            type: string
            minLength: 1
