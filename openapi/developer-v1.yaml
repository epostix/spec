          description: Key environment, live or test.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
          description: Permission scopes granted to this key.
        token_hint:
          type: string
          description: 'Masked token display, e.g. tix_live_...abcd1234'
        whitelist_ips:
          type: array
          items:
            type: string
          description: Allowed IP addresses in CIDR notation.
        created_at:
          type: string
          format: date-time
          description: When the key was created.
        expires_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: When the key expires.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: When the key was last used.
        last_used_ip:
          type: string
          nullable: true
          x-omitempty: false
          description: IP address of the last request using this key.
        request_count:
          type: integer
          format: int64
          description: Total number of requests made with this key.
    APIKeyCreateRequest:
      type: object
      required:
        - name
        - expires_at
      properties:
        name:
          type: string
          description: Human-readable name for this key.
        environment:
          type: string
          enum: [live, test]
