    FieldJobResultList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FieldJobResult'
        next_after:
          type: integer
          nullable: true
          x-omitempty: false
    BulkContactCreateRequest:
      type: object
      required:
        - contacts
      properties:
        contacts:
          type: array
