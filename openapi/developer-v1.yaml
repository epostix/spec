      summary: Undo a custom field operation
      description: >-
        Start a `field_undo` job that restores the values an operation replaced, for seven days after it ran. The
        operation is a field job's ID or the `operation_id` of a change in a contact's custom field history. A
        value changed again since then is reported as a conflict and kept. Undo never deletes contacts, never
        restores erased data, never changes consent and always runs `data_only`. It is unavailable when the
        workspace keeps no custom field history.
