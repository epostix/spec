          content:
            application/json:
              schema: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /broadcasts/{broadcast_id}/test:
    parameters:
      - name: broadcast_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Broadcasts]
      summary: Send a test of a broadcast
      description: Send the broadcast to a handful of addresses for review. Up to 5 recipients.
      operationId: sendBroadcastTest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastTestRequest' }
      responses:
        '202':
          description: Test send accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BroadcastTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /broadcasts/{broadcast_id}/cancel:
    parameters:
      - name: broadcast_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Broadcasts]
      summary: Cancel a broadcast
      description: Stop a scheduled or sending broadcast. Messages already handed off still go out.
      operationId: cancelBroadcast
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The cancelled broadcast
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Broadcast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    Forbidden:
      description: The API key may not perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    NotFound:
      description: No such record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    Conflict:
      description: The request conflicts with the current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    ValidationFailed:
      description: One or more fields are invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        RateLimit-Policy: { $ref: '#/components/headers/RateLimitPolicy' }
        RateLimit-Scope: { $ref: '#/components/headers/RateLimitScope' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/APIError' }
  headers:
    RateLimitLimit:
      description: >
        Requests permitted in the current window. Sent on every authenticated response;
        absent when the request failed authentication, because the limit is per workspace
        and the workspace is not yet known.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests still permitted in the current window. Sent on every authenticated response.
      schema: { type: integer }
    RateLimitReset:
      description: >
        Seconds until another request is permitted, or 0 when one already is.
        Sent on every authenticated response.
      schema: { type: integer }
    RateLimitPolicy:
      description: >
        The active policy as "{burst};w={window}", where window is in seconds.
        Sent on every authenticated response.
      schema: { type: string }
    RateLimitScope:
      description: >
        What the limit applies to. Always workspace, so a limiter inside one process
        cannot coordinate every worker. Sent on every authenticated response.
      schema: { type: string }
    RetryAfter:
      description: >
        Seconds to wait before retrying. Sent on rate_limit_exceeded, on
        daily_quota_exceeded as the seconds remaining until the next UTC midnight, and
        on idempotency_in_progress. Not sent on monthly_quota_exceeded.
      schema: { type: integer }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API key with tix_live_ or tix_test_ prefix. Legacy tix_ prefix also accepted.'
  schemas:
    MailboxAddress:
      oneOf:
        - type: string
          description: Email address as a plain string.
        - type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
            name:
              type: string
          description: Email address with optional display name.
    Attachment:
      type: object
      required:
        - filename
        - content
        - content_type
      properties:
        filename:
          type: string
          description: Filename of the attachment.
        content:
          type: string
          description: Base64-encoded file content.
        content_type:
          type: string
          description: MIME type of the attachment.
        content_disposition:
          type: string
          enum:
            - attachment
            - inline
          default: attachment
          description: Content disposition. Use "inline" for CID-referenced images.
        content_id:
          type: string
          description: Content-ID for inline images (e.g. "logo"). Referenced in HTML as cid:logo.
    AttachmentRef:
      type: object
      required:
        - attachment_id
      properties:
        attachment_id:
          type: string
          description: ID of a previously uploaded attachment.
    AttachmentURL:
      type: object
      required:
        - filename
        - content_url
      properties:
        filename:
          type: string
          description: Filename for the attachment.
        content_url:
          type: string
          format: uri
          description: URL to fetch the attachment from.
        content_type:
          type: string
          description: MIME type. Auto-detected from response if omitted.
    TrackingOptions:
      type: object
      properties:
        opens:
          type: boolean
          description: Override domain-level open tracking for this email.
        clicks:
          type: boolean
          description: Override domain-level click tracking for this email.
        clicks_exclude:
          type: array
          items:
            type: string
          description: URL patterns to exclude from click tracking (e.g. "unsubscribe", "magic_link").
    PreflightOptions:
      type: object
      properties:
        spam_check:
          type: boolean
          description: Run spam scoring on the email content before sending.
        validate:
          type: boolean
          description: Validate the email (DNS, formatting) before sending.
    PreflightResult:
      type: object
      properties:
        spam_score:
          type: number
          description: Spam score from content analysis.
        spam_action:
          type: string
          description: Recommended action based on spam score.
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/APIErrorDetail'
          description: Validation issues found during preflight.
    SpamCheckResult:
      type: object
      properties:
        score:
          type: number
          format: double
          description: Rspamd spam score.
        threshold:
          type: number
          format: double
          description: Score threshold for spam classification.
        verdict:
          type: string
          enum: [pass, warn, fail]
          description: Overall verdict based on score.
        action:
          type: string
          description: Recommended action from spam filter.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SpamRule'
          description: Per-rule breakdown from spam filter.
        details:
          $ref: '#/components/schemas/SpamCheckDetails'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/SpamIssue'
          description: Custom content issues detected.
    SpamRule:
      type: object
      properties:
        name:
          type: string
        score:
          type: number
          format: double
        description:
          type: string
        suggestion:
          type: string
    SpamIssue:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        suggestion:
          type: string
        severity:
          type: string
          enum: [warning, error]
    SpamCheckDetails:
      type: object
      properties:
        has_text_part:
          type: boolean
        has_html_part:
          type: boolean
        has_list_unsubscribe:
          type: boolean
        link_count:
          type: integer
        image_count:
          type: integer
        text_to_html_ratio:
          type: number
          format: double
    Email:
      type: object
      required:
        - id
        - purpose
        - pre_rendered
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: array
          items:
            type: string
        subject:
          type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        reply_to:
          type: string
        text:
          type: string
        html:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        template_id:
          type: string
        template_data:
          type: object
          additionalProperties:
            type: string
        template_version:
          type: integer
          description: The template version this message was rendered from.
        mode:
          type: string
          enum: [live, test]
          description: Whether the email was submitted with a live or a test API key. Test emails are simulated and never delivered.
        purpose:
          $ref: '#/components/schemas/EmailPurpose'
        pre_rendered:
          type: boolean
          description: Whether the HTML and text were submitted as final content that Epostix does not interpret as a template.
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          description: Arbitrary JSON metadata (up to 10KB).
        tracking:
          $ref: '#/components/schemas/TrackingOptions'
        scheduled_at:
          type: string
          format: date-time
          description: When the email is scheduled to be sent (ISO 8601).
        batch_id:
          type: string
          description: Batch ID if this email was part of a batch send.
        preflight_result:
          $ref: '#/components/schemas/PreflightResult'
        status:
          type: string
          enum:
            - pending
            - scheduled
            - sent
            - delivered
            - failed
            - cancelled
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/EmailEvent'
          description: Timeline of email events (delivery, opens, clicks, bounces). Only populated on single email retrieval.
        error_message:
          type: string
          description: Error details if delivery failed.
        failure:
          $ref: '#/components/schemas/EmailFailure'
        click_count:
          type: integer
          description: Number of tracked link clicks.
        open_count:
          type: integer
          description: Number of tracked opens.
        delivery_time_ms:
          type: integer
          format: int64
          description: Milliseconds from creation to delivery.
    EmailEvent:
      type: object
      required:
        - status
        - created_at
      properties:
        status:
          type: string
          description: Email status at the time of this event.
        created_at:
          type: string
          format: date-time
          description: When this event occurred.
        event_type:
          type: string
          description: Specific event type (e.g. opened, clicked, bounced).
    Event:
      type: object
      required:
        - id
        - type
        - created_at
        - data
      properties:
        id:
          type: string
          description: Unique event identifier.
        type:
          $ref: '#/components/schemas/EventType'
        email_id:
          type: string
          description: >
            ID of the recipient this event belongs to. A send to several to, cc and bcc addresses has one
            email_id per address, and data.send_id names the send they share. Present for every email.* event
            and absent for email.received and webhook.test.
        inbound_id:
          type: string
          description: ID of the inbound message. Present only on email.received.
        created_at:
          type: string
          format: date-time
          description: When the event occurred.
        data:
          type: object
          additionalProperties: true
          description: |
            Event-specific data. Every email event carries to, from and subject, and identifies the send it belongs to:
            - **send_id**: the id that POST /emails returned for the send, shared by every recipient of it
            - **metadata**: the metadata the send was submitted with, or null
            - **tags**: the tags the send was submitted with, or an empty array
            - **idempotency_key**: the idempotency key the send was submitted with, or null

            Webhook deliveries also carry email_id, the recipient's own id. The rest varies by event type:
            - **sent**: nothing more
            - **delivered**: attempt, mx_hostname, smtp_response
            - **bounced**: fault, reason, permanent, source, provider, smtp_code, enhanced_status_code, response.
              fault is recipient, sender or unknown (see BounceFault), reason is one of BounceReason, source is smtp, ndr or
              suppression_list (see BounceSource), provider is one of MailboxProvider. provider, smtp_code, enhanced_status_code and response
              are present when known.
              Failures on the Epostix side never produce a bounced event.
            - **failed/delayed**: reason (a readable description), attempt, mx_hostname, next_attempt_at (delayed only), and
              bounce, an object with the bounced fields above, present only when the receiving system gave a verdict
            - **failed** also carries failure, an object with reason (see EmailFailureReason) and fault (see EmailFailureFault).
              It is absent on emails that failed before failures were recorded.

            A recipient handed over for delivery gets sent once, may get delayed any number of times, and ends in
            delivered, failed or cancelled. bounced reports a receiving system's verdict and is never sent for a
            message that was not attempted. A suppressed recipient is never attempted: it gets a single failed event
            whose failure.reason is suppressed, and bounce.source is suppression_list when the address recently hard
            bounced for another sender.
            - **opened**: ip_address, user_agent, open_source, device_type, os, os_version, client, client_version, is_bot, is_machine_open
            - **clicked**: url, ip_address, user_agent, the opened fields and is_machine_click
            - **complained**: feedback_type, provider (see MailboxProvider), reported_at
            - **suppression.created/removed**: see SuppressionEventData. suppression.created fires when an address
              gains its first suppression and suppression.removed when it loses its last one.
            - **contact.status_changed**: see ContactStatusChangedEventData
            - **contact.fields_changed**: see ContactFieldsChangedEventData

            Test mode events also carry simulated and outcome.

            email.bounced and email.failed can arrive after email.delivered: a receiving server
            may accept a message and report later that it could not be delivered.
    EventListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    EmailCreate:
      type: object
      required:
        - from
        - to
        - subject
      properties:
        from:
          $ref: '#/components/schemas/MailboxAddress'
          description: Sender email address as a string or {email, name} object.
        to:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Recipient email address(es).
        subject:
          type: string
        cc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        bcc:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        reply_to:
          $ref: '#/components/schemas/MailboxAddress'
          description: Reply-to address as a string or {email, name} object.
        text:
          type: string
        html:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        template_id:
          type: string
        template_data:
          type: object
          additionalProperties:
            type: string
        template_version:
          type: integer
          minimum: 1
          description: Render a specific template version instead of the published one. Use this for safe deploys.
        attachments:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Attachment'
              - $ref: '#/components/schemas/AttachmentRef'
              - $ref: '#/components/schemas/AttachmentURL'
          description: File attachments. Supports inline content, pre-uploaded references, and URL-based.
        tags:
          type: array
          items:
            type: string
          maxItems: 50
          description: String tags for categorization. Indexed and queryable.
        metadata:
          type: object
          description: Arbitrary JSON metadata (up to 10KB). Stored and returned in events/webhooks.
        tracking:
          $ref: '#/components/schemas/TrackingOptions'
        preflight:
          $ref: '#/components/schemas/PreflightOptions'
        scheduled_at:
          type: string
          format: date-time
          description: Schedule the email for future delivery (ISO 8601). Must be in the future and within 72 hours.
        allow_duplicate:
          type: boolean
          description: Set to true to bypass duplicate detection. Use for legitimate cases like OTP resends.
        idempotency_key:
          type: string
          maxLength: 255
          description: Caller-supplied key for this message, kept for 24 hours and scoped to the workspace and its live or test environment. Resending a message with the same key and equivalent content returns the message already accepted instead of sending it again; the same key with different content is rejected with `idempotency_conflict`. In a batch, each message is deduplicated by its own key regardless of its position in the batch.
        purpose:
          $ref: '#/components/schemas/EmailPurpose'
        pre_rendered:
          type: boolean
          description: |
            Set to true when `html` and `text` are final content rendered outside Epostix. Epostix then does not interpret template syntax such as `{{ email }}` or `{{ unsubscribe_link }}` in them. Unsubscribe handling and tracking still apply. Cannot be combined with `template_id`.
    EmailPurpose:
      type: string
      enum: [transactional, marketing]
      description: |
        What the message is for. Omitted means `transactional`.

        Marketing messages count against the plan's audience contacts instead of the transactional email quota. Each recipient is added to the audience as a contact, carries a one-click unsubscribe link and `List-Id` header, is skipped when it has unsubscribed or been cleaned, and is sent from the marketing infrastructure.
    EmailUpdate:
      type: object
      properties:
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Reschedule the email. Set to null to send immediately. Must be in the future and within 72 hours.
    EmailBatchRequest:
      type: object
      required:
        - emails
      properties:
        validation:
          type: string
          enum: [strict, permissive]
          default: strict
          description: >
            strict rejects the whole batch with 422 if any message is invalid, and sends nothing.
            permissive sends the valid messages and reports the rest per index in errors.
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailCreate'
          minItems: 1
          maxItems: 100
          description: Array of emails to send (1-100).
    EmailBatchResponse:
      type: object
      required:
        - batch_id
        - results
      properties:
        batch_id:
          type: string
          description: Unique identifier for the batch.
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmailBatchResult'
        errors:
          type: array
          description: Present in permissive mode only. One entry per message that was not sent.
          items:
            $ref: '#/components/schemas/EmailBatchError'
    EmailBatchError:
      type: object
      required:
        - index
        - code
        - message
      properties:
        index:
          type: integer
          description: Position of the message in the request array.
        code:
          type: string
          description: Machine-readable reason, matching the error type catalogue.
        message:
          type: string
    EmailBatchResult:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          description: Zero-based index of the email in the request array.
        id:
          type: string
          description: Email ID (present on success).
        status:
          type: string
          enum:
            - pending
            - scheduled
            - failed
        error:
          $ref: '#/components/schemas/APIError'
          description: Error details (present on failure).
    AttachmentUpload:
      type: object
      required:
        - filename
        - content
        - content_type
      properties:
        filename:
          type: string
        content:
          type: string
          description: Base64-encoded file content.
        content_type:
          type: string
    AttachmentResponse:
      type: object
      required:
        - id
        - filename
        - content_type
        - size
        - expires_at
      properties:
        id:
          type: string
          description: Attachment ID for use in email sends.
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          description: Size in bytes.
        expires_at:
          type: string
          format: date-time
          description: When this pre-uploaded attachment expires (24 hours from upload).
    CancelEmailResponse:
      type: object
      required:
        - cancelled
      properties:
        cancelled:
          type: boolean
          description: Whether the email was successfully cancelled.
        reason:
          type: string
          description: Reason why the email could not be cancelled (present when cancelled is false).
    EmailListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    Template:
      type: object
      required: [id, name, latest_version, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        subject: { type: string }
        latest_version:
          type: integer
          description: The highest version number that exists.
        published_version:
          type: integer
          description: The version used when a send does not name one. Absent until a version is published.
        archived_at: { type: string, format: date-time }
        variables:
          type: array
          items: { type: string }
          description: Variable names found in the draft.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateWithContent:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          properties:
            version:
              type: integer
              description: The version this content came from. Absent when the draft is returned.
            html: { type: string }
            text: { type: string }
    TemplateCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
        publish:
          type: boolean
          default: true
          description: Publish the first version immediately. Set false to create a draft only.
    TemplateUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
    TemplateVersion:
      type: object
      required: [version, checksum, created_at]
      properties:
        version: { type: integer }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables:
          type: array
          items: { type: string }
        checksum: { type: string }
        created_at: { type: string, format: date-time }
    TemplateVersionCreate:
      type: object
      properties:
        subject: { type: string, maxLength: 255 }
        html: { type: string }
        text: { type: string }
        publish:
          type: boolean
          default: true
          description: Make this the published version. Set false to record it without switching sends to it.
    TemplatePublishRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    TemplateRenderRequest:
      type: object
      properties:
        template_id: { type: string }
        version: { type: integer, minimum: 1 }
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
      description: Supply either template_id, or an inline subject, html and text. Not both.
    TemplateRenderResult:
      type: object
      properties:
        subject: { type: string }
        html: { type: string }
        text: { type: string }
        variables:
          type: array
          items: { type: string }
        missing_variables:
          type: array
          items: { type: string }
          description: Variables the template uses without a default, that were not supplied in data.
    TemplateListResponse:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Template' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    TemplateVersionListResponse:
      type: object
