          description: Key environment.
        expires_at:
          type: string
          format: date-time
          description: When the key should expire.
        whitelist_ips:
          type: array
          items:
            type: string
          description: Allowed IP addresses in CIDR notation.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
          description: 'Permission scopes. Defaults to ["*"] (full access) if omitted.'
    APIKeyCreateResponse:
      type: object
      required:
        - id
        - name
        - environment
        - permissions
        - token_hint
        - token
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        environment:
          type: string
          enum: [live, test]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
        token:
          type: string
          description: 'The full API key token. It is shown only once, so store it securely.'
        token_hint:
          type: string
          description: Last 8 characters for future identification.
        whitelist_ips:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    APIKeyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated name.
        whitelist_ips:
          type: array
