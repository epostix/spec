    EventType:
      type: string
      enum:
        - email.sent
        - email.delivered
        - email.bounced
        - email.opened
        - email.clicked
        - email.complained
        - email.failed
        - email.delayed
        - email.cancelled
        - email.received
        - email.return_path_reply
        - email.address_changed
        - domain.verified
        - domain.verification_failed
        - domain.records_drifted
        - tracking_domain.verified
        - tracking_domain.verification_failed
        - campaign.started
        - campaign.paused
        - campaign.resumed
        - campaign.completed
        - campaign.cancelled
        - campaign.auto_paused
        - contact.status_changed
        - contact.import_completed
        - contact.fields_changed
        - suppression.created
        - suppression.removed
        - webhook.test
      description: >
        Every event type the platform emits. email.* events carry an email_id, except
        email.received, which fires for inbound mail and carries an inbound_id.
        email.return_path_reply fires when a person replies to the bounce (Return-Path)
        address of an email rather than to its From or Reply-To address; it carries the
        email_id of the email being answered and is never also delivered as email.received.
        email.address_changed fires when an automatic reply to an email says that the
        recipient's address has changed or is no longer in use; it carries the email_id,
        the original recipient, and new_address when the notice names exactly one other
        address, or null. It never carries the reply text, and the recipient is neither
        suppressed nor counted as bounced.
        domain.* and tracking_domain.* events carry a domain_id. domain.verified and
        domain.verification_failed fire only when a domain's status changes;
        domain.records_drifted fires once when a required record of a verified domain stops
        resolving, while the domain is still sending. campaign.* events carry a
        campaign_id, contact.* events a contact_id, and suppression.* events the suppressed
        address; these three families are workspace-wide and carry neither an email_id nor a
        domain_id. webhook.test is delivered by the test-endpoint operation and cannot be
        subscribed to. Treat this enum as open: clients must tolerate a value added by a
        later release rather than failing to decode the surrounding object.

    WebhookEventType:
      type: string
      enum:
        - email.sent
        - email.delivered
        - email.bounced
        - email.opened
        - email.clicked
        - email.complained
        - email.failed
        - email.delayed
        - email.cancelled
        - email.received
        - email.return_path_reply
        - email.address_changed
        - domain.verified
        - domain.verification_failed
        - domain.records_drifted
        - tracking_domain.verified
        - tracking_domain.verification_failed
        - campaign.started
        - campaign.paused
        - campaign.resumed
        - campaign.completed
        - campaign.cancelled
        - campaign.auto_paused
        - contact.status_changed
        - contact.import_completed
        - contact.fields_changed
        - suppression.created
        - suppression.removed
      description: >
        An event a webhook endpoint can subscribe to. This is the subscribable subset of
        EventType; webhook.test is delivered to an endpoint but is not subscribable.
    WebhookCreateRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          description: The URL to receive webhook events.
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          description: Event types to subscribe to.
        domain_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >
            Restrict this endpoint to the listed domains. Empty means every domain in the
            workspace. Only email.* and domain.*/tracking_domain.* events carry a domain, so
            an endpoint subscribed to a campaign.*, contact.* or suppression.* event must
            leave this empty.
        custom_field_ids:
          type: array
          items:
            type: string
            format: uuid
          description: >
            The custom fields a contact.fields_changed subscription may receive. Required with
            that event and only allowed with it; a change to any other field is left out of the
            payload, and an event with none of these fields is not delivered.
        description:
          type: string
          description: Optional description of the webhook endpoint.
        secret:
          type: string
          description: Signing secret. Auto-generated if omitted.

    WebhookCreateResponse:
      type: object
      required:
        - id
        - url
        - events
        - active
        - secret
        - created_at
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        domain_ids:
          type: array
          items:
            type: string
            format: uuid
        custom_field_ids:
          type: array
          items:
            type: string
            format: uuid
        description:
          type: string
        active:
          type: boolean
        secret:
          type: string
          description: Plaintext signing secret. Shown only on create and rotate.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Webhook:
      type: object
      required:
        - id
        - url
        - events
        - active
        - created_at
      properties:
        id:
          type: string
        url:
          type: string
