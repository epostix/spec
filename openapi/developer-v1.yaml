      summary: Create a custom field job
      description: >-
        Write custom field values to up to 1,000 existing contacts (at most 5 MiB) asynchronously. Every item is
        validated first and the job freezes the addressed contacts and the versions of the fields it writes. It
        then runs unless `dry_run` is true, in which case it stops at `ready` until it is confirmed. Each item
        succeeds or fails on its own; a field changed by someone else after validation is reported as a conflict
        and left alone. Jobs are `data_only` unless `activation` is `activate`. Poll the job and read its results;
        the change is recorded in each contact's custom field history under the job's ID.
      operationId: createFieldJob
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Unique key for this job, scoped to the workspace and kept for 24 hours. Repeating the request with the
            same key and body returns the original job; the same key with a different body returns 409
            `idempotency_conflict`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldJobCreate'
      responses:
        '202':
          description: The job was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldJob'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
