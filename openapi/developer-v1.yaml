    PermissionScope:
      type: string
      enum:
        - sending
        - 'emails:read'
        - 'domains:read'
        - 'domains:manage'
        - 'contacts:read'
        - 'contacts:manage'
        - 'custom-fields:read'
        - 'custom-fields:manage'
        - 'webhooks:read'
        - 'webhooks:manage'
        - 'analytics:read'
        - 'api-keys:read'
        - 'api-keys:manage'
        - 'suppressions:read'
        - 'suppressions:manage'
        - 'templates:read'
        - 'templates:manage'
        - 'inbound:read'
        - 'inbound:manage'
        - 'broadcasts:read'
        - 'broadcasts:manage'
        - 'broadcasts:send'
        - '*'
      description: >
        The base permission vocabulary for an API key. A key is granted
        `PermissionGrant` values, which are these scopes optionally narrowed to a
        single domain.
    PermissionGrant:
      type: string
      pattern: '^(\*|[a-z][a-z-]*(:[a-z-]+)?(:domain:[A-Za-z0-9.-]{1,253})?)$'
      description: >
        A permission scope, optionally narrowed to one domain with the suffix
        `:domain:{domain_name}`. Base scopes grant access to all domains.
        Per-domain restriction is supported for `sending`, `emails:read`, `domains:read` and `domains:manage`,
        so `sending:domain:acme.com` restricts sending to acme.com only. Multiple
        domain-scoped permissions can be combined. See `PermissionScope` for the base
        vocabulary.
    APIKeyResponse:
      type: object
      required:
        - id
        - name
        - environment
        - permissions
        - token_hint
        - created_at
      properties:
        id:
          type: string
          description: Unique API key identifier.
        name:
          type: string
          description: Human-readable name for this key.
        environment:
          type: string
