              email:
                type: string
                description: Email address of the failed contact.
              message:
                type: string
                description: Error message.
              code:
                type: string
                description: Error code — `validation_error`, `tag_not_found`, `contact_erased` or `internal_error`.
          description: Details of failed contacts.
    Tag:
      type: object
