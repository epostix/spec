    ContactFieldsChangedEventData:
      type: object
      description: >
        The data of contact.fields_changed events. Delivery is at least once and unordered:
        deduplicate on the event id and ignore an event whose contact_version is not newer
        than one already applied for the contact. changes lists only the fields the endpoint
        is allowed, in canonical form; a field the change left unset has no before, and a
        cleared field has no after. activation tells whether the change may trigger marketing
        actions (activate) or should only update data (data_only); honour it in automations.
      required: [contact_id, contact_version, schema_version, source, activation, actor, operation_id, committed_at, changes]
      properties:
        contact_id:
          type: string
        contact_version:
          type: integer
          format: int64
        schema_version:
          type: integer
          description: Version of this payload's shape, currently 1.
        source: { $ref: '#/components/schemas/CustomFieldChangeSource' }
        activation:
          type: string
          enum: [data_only, activate]
        actor: { $ref: '#/components/schemas/CustomFieldActor' }
        operation_id:
          type: string
        committed_at:
          type: string
          format: date-time
        changes:
          type: array
          items:
            type: object
            required: [field_id, key]
            properties:
              field_id:
                type: string
              key:
                type: string
              before:
                description: The value before the change. Absent when the field was not set.
              after:
                description: The value after the change. Absent when the change cleared it.

    EmailFailureReason:
      type: string
      enum:
        - suppressed
        - invalid_recipient
        - bounced
        - expired
        - attachment_too_large
        - attachment_unavailable
        - dkim_key_mismatch
        - sending_restricted
        - platform_error
        - not_delivered
        - contact_limit_exceeded
      x-enum-varnames:
        - EmailFailureReasonSuppressed
        - EmailFailureReasonInvalidRecipient
        - EmailFailureReasonBounced
        - EmailFailureReasonExpired
        - EmailFailureReasonAttachmentTooLarge
        - EmailFailureReasonAttachmentUnavailable
        - EmailFailureReasonDkimKeyMismatch
        - EmailFailureReasonSendingRestricted
        - EmailFailureReasonPlatformError
        - EmailFailureReasonNotDelivered
        - EmailFailureReasonContactLimitExceeded
      description: >
        Why the email failed. suppressed means the recipient is on the suppression list, invalid_recipient means
        the address cannot receive mail, bounced means a receiving server refused the message, expired means
        delivery kept being deferred until the retry window ran out, attachment_too_large and attachment_unavailable
        mean an attachment could not be included, dkim_key_mismatch means the sending domain's DKIM record is missing
        or does not match its signing key, sending_restricted means sending from the workspace was restricted until
        the message expired, platform_error means the failure was on the Epostix side, and not_delivered means
        the message was not delivered for a reason that could not be attributed, and contact_limit_exceeded means
        the recipient is past the number of subscribed contacts the workspace's plan can send marketing email to.
        New values may be added.
    EmailFailureFault:
      type: string
      enum: [recipient, sender, platform, unknown]
      x-enum-varnames:
        - EmailFailureFaultRecipient
        - EmailFailureFaultSender
        - EmailFailureFaultPlatform
        - EmailFailureFaultUnknown
      description: >
        Who is responsible for the failure. recipient means the address itself, sender means the message, the
        sending domain or the workspace, platform means Epostix, and unknown means it could not be determined.
    EmailFailure:
      type: object
      required:
        - reason
        - fault
      description: Why a failed email was not delivered. Present only on emails whose status is failed.
      properties:
        reason:
          $ref: '#/components/schemas/EmailFailureReason'
        fault:
          $ref: '#/components/schemas/EmailFailureFault'
    BounceFault:
      type: string
      enum: [recipient, sender, unknown]
      description: >
        Who the receiving system held responsible. recipient means the address itself cannot take mail,
        sender means the message or the sending reputation was refused, unknown means the reply did not say
        or the recipient's mail servers could not be reached.
        Failures on the Epostix side never appear as a bounce.
    BounceReason:
      type: string
      enum:
        - mailbox_unknown
        - mailbox_full
        - mailbox_disabled
        - domain_unroutable
        - blocklist
        - reputation
        - rate_limited
        - policy
        - content
        - authentication
        - sender_address
        - domain_unreachable
        - unclassified
      description: >
        Why the message was refused. mailbox_unknown, mailbox_full, mailbox_disabled and domain_unroutable come
        with fault recipient; domain_unreachable and unclassified come with fault unknown; every other reason comes
        with fault sender. domain_unreachable means the recipient's mail servers could not be reached until delivery
        was given up; it suppresses the address progressively but does not count toward your bounce rate.
    BounceSource:
      type: string
      enum: [smtp, ndr, suppression_list]
      description: >
        smtp is the receiving server's reply during delivery, ndr is a bounce message received after the server
        accepted the email, and suppression_list means the email was not sent because the address hard bounced on
        Epostix within the last 14 days. A suppression_list bounce counts toward your bounce rate and suppresses the
        address in your workspace.
    MailboxProvider:
      type: string
      enum:
        - gmail
        - microsoft
        - yahoo
        - apple
        - proton
        - zoho
        - gmx
        - wp
        - onet
        - interia
        - mailru
        - yandex
        - orange
        - free
        - sfr
        - laposte
        - tonline
        - seznam
        - italiaonline
        - comcast
        - other
      x-enum-varnames:
        - MailboxProviderGmail
        - MailboxProviderMicrosoft
        - MailboxProviderYahoo
        - MailboxProviderApple
        - MailboxProviderProton
        - MailboxProviderZoho
        - MailboxProviderGMX
        - MailboxProviderWP
        - MailboxProviderOnet
        - MailboxProviderInteria
        - MailboxProviderMailRu
        - MailboxProviderYandex
        - MailboxProviderOrange
        - MailboxProviderFree
        - MailboxProviderSFR
        - MailboxProviderLaPoste
        - MailboxProviderTOnline
        - MailboxProviderSeznam
        - MailboxProviderItaliaonline
        - MailboxProviderComcast
        - MailboxProviderOther
      description: >
        Receiving mailbox provider. orange covers Orange and Wanadoo, free covers Free and Alice, sfr covers SFR,
        Neuf, Numericable and Club Internet, tonline covers T-Online and Magenta, seznam covers Seznam and email.cz,
        italiaonline covers Libero and Virgilio, and other covers every provider without its own value. New values
        may be added.
    BounceHistoryEntry:
      type: object
      required:
        - kind
        - created_at
      properties:
        kind:
          type: string
          enum: [bounce, complaint]
          description: A bounce carries the verdict fields; a complaint carries feedback_type.
        fault:
          $ref: '#/components/schemas/BounceFault'
        reason:
          $ref: '#/components/schemas/BounceReason'
        permanent:
          type: boolean
          description: Whether the receiving system said retrying will not help.
        source:
          $ref: '#/components/schemas/BounceSource'
        provider:
          $ref: '#/components/schemas/MailboxProvider'
        smtp_code:
          type: integer
          description: SMTP reply code. Absent when the receiving system gave none.
        enhanced_status_code:
          type: string
          description: RFC 3463 enhanced status code, for example 5.1.1.
        response:
          type: string
          description: The receiving system's response text.
        feedback_type:
          type: string
          description: Feedback type of the complaint report, for example abuse. Present only on complaints.
        created_at:
          type: string
          format: date-time

    SuppressionListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Suppression'
        has_more:
          type: boolean
        next_cursor:
          type: string

    SuppressionCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    BulkSuppressionCreate:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            type: string
            format: email
          minItems: 1
          maxItems: 1000

    BulkSuppressionResponse:
      type: object
      required:
        - processed
        - failed
      properties:
        processed:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BulkSuppressionError'

    BulkSuppressionError:
      type: object
      properties:
        index:
          type: integer
        email:
          type: string
        message:
          type: string
