          maxLength: 100
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Tag color as hex string (e.g., "#3B82F6").
    TagListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        has_more:
