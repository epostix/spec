              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      tags: [Suppressions]
      summary: Remove manual, cleaned or workspace unsubscribe suppression
      description: Remove a manual suppression, one added by an audience clean, or an unsubscribe your workspace recorded for a contact. An address can carry more than one of these; a removal takes off the one listed for it, and the address stays suppressed until none remain. Removing the suppression that set the contact's status resubscribes the contact once no other suppression remains; if one does, the contact takes the status that suppression sets. An unsubscribe made by the recipient and system suppressions (bounces, complaints) cannot be removed via API.
