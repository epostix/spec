            - no_data
            - new
            - engaged
            - at_risk
            - inactive
            - cold
          description: Engagement tier based on email activity (read-only, computed by the system).
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: Tags assigned to this contact.
        campaigns_received_count:
          type: integer
          description: Number of campaigns this contact has received (read-only).
        last_activity_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
          description: Last activity timestamp (read-only).
        custom_fields:
          $ref: '#/components/schemas/CustomFieldValues'
        created_at:
          type: string
          format: date-time
          description: When the contact was created.
        updated_at:
          type: string
          format: date-time
          description: When the contact was last updated.
        custom_field_sources:
          $ref: '#/components/schemas/CustomFieldSources'
    ContactCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Contact email address.
        name:
          type: string
          description: Contact display name. When the contact already exists, omitting it keeps the stored name and an empty string clears it.
        tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Tag IDs to assign to the contact. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written. In a bulk request, a contact with an unknown tag is not written and is reported with code `tag_not_found`.
        custom_fields:
          $ref: '#/components/schemas/CustomFieldValues'
        custom_fields_add:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_fields_remove:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_field_sources:
          $ref: '#/components/schemas/CustomFieldSourceWrites'
    ContactUpdate:
      type: object
      properties:
        name:
          type: string
          description: Contact display name. When the contact already exists, omitting it keeps the stored name and an empty string clears it.
        tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Replaces the contact's tags with exactly these; an empty array removes every tag. Cannot be combined with `add_tag_ids` or `remove_tag_ids`. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        add_tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Tag IDs to add, keeping the contact's other tags. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        remove_tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Tag IDs to remove, keeping the contact's other tags. An ID cannot appear in both `add_tag_ids` and `remove_tag_ids`. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        custom_fields:
          $ref: '#/components/schemas/CustomFieldValues'
        custom_fields_add:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_fields_remove:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_field_sources:
          $ref: '#/components/schemas/CustomFieldSourceWrites'
    ContactUpsert:
      type: object
      properties:
        name:
          type: string
          description: Contact display name. When the contact already exists, omitting it keeps the stored name and an empty string clears it.
        tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Replaces the contact's tags with exactly these; an empty array removes every tag. Cannot be combined with `add_tag_ids` or `remove_tag_ids`. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        add_tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Tag IDs to add, keeping the contact's other tags. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        remove_tag_ids:
          type: array
          maxItems: 100
          items:
            type: string
          description: Tag IDs to remove, keeping the contact's other tags. An ID cannot appear in both `add_tag_ids` and `remove_tag_ids`. Every ID must be a tag in this workspace; otherwise the request fails with 400 and nothing is written.
        custom_fields:
          $ref: '#/components/schemas/CustomFieldValues'
        custom_fields_add:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_fields_remove:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_field_sources:
          $ref: '#/components/schemas/CustomFieldSourceWrites'
    CustomFieldValues:
      type: object
      additionalProperties: true
      description: >
        Custom field values keyed by field key, in each field's canonical form: strings for
        text, URL, date (`2026-11-30`), datetime (`2026-11-30T09:00:00Z`), birthday (`02-29`),
        single select (the option key) and decimal (an exact decimal string such as `"1250.5"`);
        a JSON integer for integer fields; `true` or `false` for boolean fields; and an array
        of option keys for multiselect fields. On a contact, every stored value of the
        workspace's active fields is returned when the contact is fetched, and only when the
        request carried custom fields after a write; lists include the fields named in
        `custom_fields`. In a request, an omitted key keeps its value, `null` removes it, and
        `""`, `[]`, `false` and `0` are stored values; an empty string is only accepted on
        text fields. An array on a multiselect replaces the whole selection. A list field is
        an array of its item type, kept in order without duplicates. An object field is an
        object of its child fields: in a request, omitted children keep their values and a
        child `null` removes that child. A repeatable object is an array of objects, each with
        a unique `item_id`; sending the array replaces every item and needs the contact's
        custom field version in If-Match (`version_required` otherwise). An empty object or
        array is a stored value distinct from no value. The whole map is validated before
        anything is written. `custom_fields: null` is rejected; remove fields one at a time.
        Not accepted by bulk creation.
    CustomFieldSourceWrites:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CustomFieldSourceWrite'
      description: >
        Provenance for the custom fields written in the same request, keyed by field key. A
        field that is integration managed by the calling API key requires `ownership_version`
        and `revision`: an older revision is rejected with `stale_revision`, repeating the
        stored revision with the same value changes nothing, repeating it with a different
        value is rejected with `revision_conflict`, and a write carrying a former ownership
        version is rejected with `ownership_version_stale`. `observed_at` may be sent for any
        field and must not be in the future.
    CustomFieldSourceWrite:
      type: object
      properties:
        ownership_version:
          type: integer
          format: int64
          minimum: 1
          description: The field's ownership version the write is based on.
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Increases with every change the integration makes to this contact's field.
        observed_at:
          type: string
          format: date-time
          description: When the source system observed the value.
    CustomFieldSources:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CustomFieldSource'
      description: Where each stored custom value came from, keyed by field key.
    CustomFieldSource:
      type: object
      required: [source, source_id, ownership_version, revision, observed_at, committed_at, stale]
      properties:
        source:
          type: string
          description: The writer kind (dashboard, api or merge); empty for a value stored before sources were recorded.
        source_id:
          type: string
          description: The user or API key that wrote the value.
        ownership_version:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
          nullable: true
          x-omitempty: false
        observed_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
        committed_at:
          type: string
          format: date-time
        stale:
          type: boolean
          nullable: true
          x-omitempty: false
          description: Whether the value is past the field's freshness expectation; null when the field has none.
    CustomFieldHistory:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldRevision' }
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: Pass as starting_after to read the next, older page. Absent on the last page.
    CustomFieldRevision:
      type: object
      required: [id, contact_id, field_id, field_key, actor, source, operation_id, contact_version, committed_at]
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        field_id:
          type: string
          format: uuid
        field_key:
          type: string
        before:
          description: The value before the change, in the field's canonical form. Absent when the field was not set.
        after:
          description: The value after the change, in the field's canonical form. Absent when the change cleared the field.
        actor: { $ref: '#/components/schemas/CustomFieldActor' }
        source: { $ref: '#/components/schemas/CustomFieldChangeSource' }
        operation_id:
          type: string
          format: uuid
          description: Shared by every revision written by the same request.
        contact_version:
          type: integer
          format: int64
          description: The contact's custom field version (its ETag) after the change.
        committed_at:
          type: string
          format: date-time
    PreferenceLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    CustomFieldActor:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [user, api_key, recipient]
        id:
          type: string
          description: The dashboard user or API key that made the change, or for a recipient the collection form and its version.
    CustomFieldChangeSource:
      type: string
      enum: [dashboard, api, import, form]
      description: Where the change came from. Treat this enum as open; later releases add sources such as imports.
    CustomFieldMembership:
      type: object
      additionalProperties: true
      description: >
        Option keys to add to or remove from multiselect fields, keyed by field key, keeping
        the field's other options. Adding to a field without a value creates the selection;
        removing its last option leaves an empty selection. Duplicates, empty lists and
        removing an option that is not selected change nothing. For a list field, the values
        to append when absent or to remove. For a repeatable object, `custom_fields_add` takes
        items to upsert by `item_id` (an existing item keeps the children the item omits) and
        `custom_fields_remove` takes the `item_id`s to remove. Child fields of an object are
        addressed with the same nesting as `custom_fields`, such as
        `{"billing": {"tags": ["vip"]}}`. A field, or a parent and one of its children, may
        appear in only one of `custom_fields`, `custom_fields_add` and `custom_fields_remove`.
    ContactListResponse:
      type: object
      required:
        - data
        - has_more
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        has_more:
          type: boolean
          description: Whether there are more items available after this page.
        next_cursor:
          type: string
          description: Cursor to use as starting_after for the next page.
    ContactSearchRequest:
      type: object
      properties:
        where:
          $ref: '#/components/schemas/ContactPredicate'
        sort_field:
          type: string
          format: uuid
          description: >-
            Sort by a custom field instead of newest first: numerically or chronologically, case-folded for
            short text and URLs, and by option label for single select. Contacts without a value come last in
            both directions, ties are broken by contact ID. Long text, multiselect and boolean fields cannot be sorted.
        sort_order:
          type: string
          enum: [asc, desc]
        limit:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        starting_after:
          type: string
          description: Cursor for forward pagination (a contact ID from a previous page).
        ending_before:
          type: string
          description: Cursor for backward pagination.
        custom_fields:
          type: array
          description: Custom field keys to include as `custom_fields` on each contact.
          items:
            type: string
    ContactPredicate:
      type: object
      description: >-
        One node of a contact predicate: either a group (`match` and `children`) or a condition
        (`field`, `operator` and the operand members its operator needs). Custom field conditions
        use `field: custom_field` with `field_id`, and select options are identified by option ID.
        Negative operators never match contacts without a value; select them with `is_not_set`.
        A child field of an object is addressed by its own field ID. A group with `item_field_id` names a
        repeatable object and matches only when all its conditions hold on the same item; every
        condition in it must address a child of that repeatable object. A condition on such a child
        outside a group matches when any one item satisfies it. `count_eq`, `count_gt`, `count_lt`
        and `count_between` compare the number of list entries or items with `number` (and the
        upper bound for `count_between`).
      properties:
        match:
          type: string
          enum: [all, any]
        item_field_id:
          type: string
          format: uuid
          description: Makes the group a same-item group over this repeatable object field.
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContactPredicate'
        field:
          type: string
          enum:
            - email
            - name
            - status
            - source
            - engagement_tier
            - tag
            - created_at
            - last_activity_at
            - campaigns_received_count
            - custom_field
        field_id:
          type: string
          format: uuid
        operator:
          type: string
          enum:
            - eq
            - neq
            - contains
            - not_contains
            - starts_with
            - ends_with
            - is_empty
            - is_not_empty
            - any_of
            - all_of
            - none_of
            - gt
            - gte
            - lt
            - lte
            - between
            - within_last
            - within_next
            - never
            - "on"
            - is_set
            - is_not_set
            - is_true
            - is_false
            - anniversary_within
            - is_stale
            - count_eq
            - count_gt
            - count_lt
            - count_between
        text:
          type: string
        values:
          type: array
          description: Tag IDs, option IDs or enum values.
          items:
            type: string
        number:
          type: integer
          format: int64
        upper_number:
          type: integer
          format: int64
        decimal:
          type: string
          description: Exact decimal such as `"1250.50"`.
        upper_decimal:
          type: string
        date:
          type: string
          format: date
          description: Calendar date for date fields and for `on` over a datetime field.
        upper_date:
          type: string
          format: date
        time:
          type: string
          format: date-time
        upper_time:
          type: string
          format: date-time
        birthday:
          type: string
          description: Month and day such as `"02-29"`.
        window:
          type: object
          required: [amount, unit]
          properties:
            amount:
              type: integer
            unit:
              type: string
              enum: [hours, days, weeks, months]
    FieldJobCreate:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/FieldJobItem'
        dry_run:
          type: boolean
          default: false
          description: Validate and stop at `ready` instead of running.
        activation:
          $ref: '#/components/schemas/FieldActivation'
    FieldJobItem:
      type: object
      description: One existing contact, addressed by exactly one of `contact_id` and `email`, and its change.
      properties:
        contact_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        custom_fields:
          $ref: '#/components/schemas/CustomFieldValues'
        custom_fields_add:
          $ref: '#/components/schemas/CustomFieldMembership'
        custom_fields_remove:
          $ref: '#/components/schemas/CustomFieldMembership'
    FieldActivation:
      type: string
      enum: [data_only, activate]
      description: >-
        `data_only` (the default) updates values, history and segment membership without triggering Epostix
        marketing actions; `activate` also lets rules act on the change. Webhook consumers receive the policy and
        should honor it.
    FieldJobStatus:
      type: string
      enum: [validating, ready, queued, running, completed, partial, failed, cancelled, conflicted, undoing, undone]
    FieldJob:
      type: object
      required:
        - id
        - kind
        - status
        - source
        - activation
        - total
        - processed
        - failed
        - conflicted
        - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [field_change, field_undo, contact_restore]
        status:
          $ref: '#/components/schemas/FieldJobStatus'
        source:
          type: string
          description: Where the job came from, such as `api`, `dashboard` or `undo`.
        activation:
          $ref: '#/components/schemas/FieldActivation'
        total:
          type: integer
        processed:
          type: integer
          description: Items written (or restored, for an undo job).
        failed:
          type: integer
        conflicted:
          type: integer
        undoable:
          type: boolean
          nullable: true
          x-omitempty: false
        undo_expires_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
        undoes_operation_id:
          type: string
          format: uuid
          nullable: true
          x-omitempty: false
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
        completed_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    ContactExportFormat:
      type: string
      enum: [spreadsheet_csv, package]
    ContactExportCreate:
      type: object
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/ContactExportFormat'
