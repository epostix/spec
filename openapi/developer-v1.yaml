        - name: ending_before
          in: query
          required: false
          schema:
            type: string
          description: Cursor for backward pagination.
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: Filter by email address (partial match).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - subscribed
              - unsubscribed
              - cleaned
              - bounced
          description: Filter by subscription status.
        - name: engagement_tier
          in: query
          required: false
          schema:
            type: string
            enum:
              - no_data
              - new
              - engaged
              - at_risk
              - inactive
              - cold
          description: Filter by engagement tier.
        - name: tag_id
          in: query
          required: false
          schema:
            type: string
          description: Filter contacts that have this tag assigned.
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter contacts created after this timestamp (ISO 8601).
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Filter contacts created before this timestamp (ISO 8601).
        - name: custom_fields
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: Comma-separated custom field keys to include as `custom_fields` on each contact. Only these fields are loaded; an unknown or archived key returns 422.
