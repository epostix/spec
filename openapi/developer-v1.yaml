          type: string
    CustomFieldType:
      type: string
      enum:
        - short_text
        - long_text
        - integer
        - decimal
        - boolean
        - date
        - datetime
        - birthday
        - single_select
        - multiselect
        - url
        - scalar_list
        - object
        - repeatable_object
    CustomFieldPreset:
      type: string
      description: A system catalog (country ISO 3166-1 alpha-2, language ISO 639-1, timezone IANA) for single_select, or phone for short_text. A phone field stores E.164 numbers.
      enum: [country, language, timezone, phone]
    CustomFieldConstraints:
      type: object
      description: Rules every value must satisfy. Bounds are inclusive and use the value format of the field type. Sent on update, it replaces the whole set; a set that rejects values the current one allowed stays pending until activated.
      properties:
        max_length: { type: integer, minimum: 1, description: short_text and long_text }
        minimum: { type: string, description: 'integer, decimal, date and datetime' }
        maximum: { type: string, description: 'integer, decimal, date and datetime' }
        scale: { type: integer, minimum: 0, maximum: 6, description: Fractional digits allowed in a decimal }
        min_selected: { type: integer, minimum: 1, description: multiselect }
        max_selected: { type: integer, minimum: 1, description: multiselect }
    CustomFieldConstraintViolation:
      type: object
      required: [contact_id, email, value, code, constraint]
      properties:
        contact_id: { type: string, format: uuid }
        email: { type: string }
        value:
          description: The stored value in its canonical form; null when the API key may not read the field.
          nullable: true
          x-omitempty: false
        code: { type: string }
        constraint: { type: string }
    CustomFieldConstraintViolationList:
      type: object
      required: [total, data]
      properties:
        total: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/CustomFieldConstraintViolation' }
        next_cursor: { type: string, format: uuid }
    CustomFieldLifecycle:
      type: string
      enum:
        - active
        - archived
        - pending_delete
    CustomFieldOperation:
      type: string
      enum:
        - update
        - archive
        - restore
        - add_option
        - update_option
        - retire_option
        - reorder_options
        - add_child
    CustomFieldOption:
      type: object
      required: [id, key, label, position, retired, retired_at]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        label: { type: string }
        position: { type: integer }
        retired: { type: boolean }
        retired_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    CustomField:
      type: object
      required: [id, parent_id, key, path, children, kind, label, description, group, position, type, lifecycle, version, options, internal_only, constraints, access, permitted_operations, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        parent_id:
          type: string
          format: uuid
          nullable: true
          x-omitempty: false
          description: The containing object field; null for a root field.
        key:
          type: string
          description: Immutable API key, unique among its siblings, used to address the field in contact writes.
        kind:
          type: string
          enum: [stored, derived]
          description: A derived field is calculated from other fields and rejects writes with read_only.
        path:
          type: string
          description: Dot-separated keys from the root field, such as billing_address.city; never reused.
        label: { type: string }
        description: { type: string }
        group: { type: string }
        position: { type: integer }
        type: { $ref: '#/components/schemas/CustomFieldType' }
        item_type: { $ref: '#/components/schemas/CustomFieldType' }
        children:
          type: array
          description: Declared child fields of an object or repeatable object, in display order; empty otherwise.
          items: { $ref: '#/components/schemas/CustomField' }
        lifecycle: { $ref: '#/components/schemas/CustomFieldLifecycle' }
        version:
          type: integer
          format: int64
          description: Increases with every change; the ETag carries it.
        options:
          type: array
          description: Select options in display order, retired ones included.
          items: { $ref: '#/components/schemas/CustomFieldOption' }
        internal_only:
          type: boolean
          description: Never offered on forms and never used to personalize campaigns.
        constraints: { $ref: '#/components/schemas/CustomFieldConstraints' }
        pending_constraints: { $ref: '#/components/schemas/CustomFieldConstraints' }
        preset: { $ref: '#/components/schemas/CustomFieldPreset' }
        access: { $ref: '#/components/schemas/CustomFieldPermissions' }
        permitted_operations:
          type: array
          description: What this API key may do with the field in its current state.
          items: { $ref: '#/components/schemas/CustomFieldOperation' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at:
          type: string
          format: date-time
          nullable: true
          x-omitempty: false
    CustomFieldPermissions:
      type: object
      description: What a role or API key may do with the field's values. Write, personalize and export need read.
      required: [read, write, personalize, export]
      properties:
        read: { type: boolean }
        write: { type: boolean }
        personalize: { type: boolean }
        export: { type: boolean }
    CustomFieldGrant:
      type: object
      required: [subject_kind, subject_id, permissions]
      properties:
        subject_kind:
          type: string
          enum: [role, api_key]
        subject_id:
          type: string
          description: A role value (a built-in role name or role:<id>) or an API key ID.
        permissions: { $ref: '#/components/schemas/CustomFieldPermissions' }
    CustomFieldGrants:
      type: object
      description: Overrides of the field's default access. A role without a grant can read and write the field as far as its workspace permissions allow; an API key without a grant cannot use it. The owner always has full access.
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/CustomFieldGrant' }
    CustomFieldLimits:
      type: object
      required: [key_max_length, label_max_length, description_max_length, group_max_length, option_label_max_length, options_per_field]
      properties:
        key_max_length: { type: integer }
        label_max_length: { type: integer }
        description_max_length: { type: integer }
        group_max_length: { type: integer }
        option_label_max_length: { type: integer }
        options_per_field: { type: integer }
    CustomFieldUsage:
      type: object
      required: [active, active_limit, retained, retained_limit, warning_percent, warning, limits]
      properties:
        active:
          type: integer
          description: Active definitions, counted against active_limit.
        active_limit: { type: integer }
        retained:
          type: integer
          description: Active and archived definitions, counted against retained_limit.
        retained_limit: { type: integer }
        warning_percent: { type: integer }
        warning:
          type: boolean
          description: True once active reaches warning_percent of active_limit.
        limits: { $ref: '#/components/schemas/CustomFieldLimits' }
    CustomFieldListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/CustomField' }
        has_more: { type: boolean }
        next_cursor: { type: string }
    CustomFieldOptionCreate:
      type: object
      required: [key, label]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
