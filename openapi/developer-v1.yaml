    ConsentSource:
      type: string
      enum:
        - api
        - dashboard
        - import
        - bulk_operation
        - smtp
        - unsubscribe_link
        - one_click
        - mailto
        - feedback_loop
        - bounce
        - cleanup
        - operator
      x-enum-varnames:
        - ConsentSourceApi
        - ConsentSourceDashboard
        - ConsentSourceImport
        - ConsentSourceBulkOperation
        - ConsentSourceSmtp
        - ConsentSourceUnsubscribeLink
        - ConsentSourceOneClick
        - ConsentSourceMailto
        - ConsentSourceFeedbackLoop
        - ConsentSourceBounce
        - ConsentSourceCleanup
        - ConsentSourceOperator
      description: >
        What made a consent or suppression change. api is the Developer API, dashboard the
        Epostix dashboard, import a CSV import, bulk_operation a dashboard bulk action, smtp a
        contact created by sending over SMTP, unsubscribe_link the unsubscribe page,
        one_click an RFC 8058 one-click unsubscribe, mailto an unsubscribe email,
        feedback_loop a mailbox provider's complaint report, bounce the receiving server,
        cleanup an audience cleanup, and operator an Epostix operator. New values may be added.

    SuppressionScope:
      type: string
      enum: [all, marketing]
      x-enum-varnames: [SuppressionScopeAll, SuppressionScopeMarketing]
      description: Which email the suppression blocks. all blocks every email; marketing blocks marketing email only.

    SuppressionOrigin:
      type: string
      enum: [workspace, recipient]
      x-enum-varnames: [SuppressionOriginWorkspace, SuppressionOriginRecipient]
      description: >
        Who set the suppression. recipient suppressions (opt-outs and complaints) cannot be
        removed or overridden by a resubscribe; workspace suppressions can.

    SuppressionRecord:
      type: object
      required:
        - reason
        - scope
        - origin
        - source
        - temporary
        - suppressed_until
        - created_at
        - updated_at
      properties:
        reason:
          type: string
          enum: [hard_bounce, soft_bounce, complaint, manual, unsubscribe, cleaned]
