  /contacts/restores:
    post:
      tags: [Contacts]
      summary: Restore contacts from an export package
      description: >-
        Upload a `package` export (at most 50 MB through the API). The version and checksum are verified, a field mapping is
        proposed and every contact is validated; the restore then waits at `ready` until it is confirmed. A restore
        never changes the status of an existing contact and never recreates an erased one. It is `data_only` unless
        confirmed with `activation: activate`, and its changes can be undone through
        `POST /contacts/field-operations/{operation_id}/undo` with the restore's ID.
      operationId: createContactRestore
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for this request, scoped to the workspace and kept for 24 hours.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Validating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRestore'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
